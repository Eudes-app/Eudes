name: Update delivery project

on:
  workflow_run:
    workflows: ["iOS tests", "Validation finale — compiler et fusionner"]
    types: [completed]
  issues:
    types: [opened, assigned]
  pull_request_target:
    types: [opened, reopened, ready_for_review, review_requested, synchronize, converted_to_draft, labeled, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove review validation when new commits arrive
        if: github.event_name == 'pull_request_target' && (github.event.action == 'synchronize' || github.event.action == 'converted_to_draft')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq 'review-validée'; then
            gh pr edit "$PR_NUMBER" --remove-label 'review-validée'
          fi

      - name: Check out trusted default-branch automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update linked project issue
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: python3 tools/update-project-workflow.py
