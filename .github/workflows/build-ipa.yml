name: Build IPA

on:
  workflow_dispatch:
    inputs:
      delivery_id:
        description: 'Lot à reconstruire (vide = nouveau lot ; même identifiant = mêmes numéros)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Reserve delivery version
    runs-on: xcode-27
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      build: ${{ steps.reserve.outputs.build }}
      delivery_id: ${{ steps.reserve.outputs.delivery_id }}
    steps:
      - name: Check out current sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reserve or reuse delivery numbers
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ID: ${{ inputs.delivery_id }}
        run: python3 tools/delivery_version.py --delivery-id "$DELIVERY_ID"

  build:
    name: Build unsigned IPA (device)
    needs: version
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DELIVERY_VERSION: ${{ needs.version.outputs.version }}
      DELIVERY_BUILD: ${{ needs.version.outputs.build }}
      DELIVERY_ID: ${{ needs.version.outputs.delivery_id }}
    steps:
      - name: Check out current sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build Release app for device (unsigned)
        run: |
          if [[ -z "${DEVELOPER_DIR:-}" ]]; then
            DEVELOPER_DIR="$(xcode-select -p)"
            if [[ "$DEVELOPER_DIR" == */CommandLineTools && -d /Applications/Xcode.app/Contents/Developer ]]; then
              DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
            fi
          fi
          export DEVELOPER_DIR
          xcodebuild -version
          xcodebuild \
            -project ios/Eudes.xcodeproj \
            -scheme Eudes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$DELIVERY_VERSION" \
            CURRENT_PROJECT_VERSION="$DELIVERY_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app and widget versions and package unsigned IPA
        id: package
        run: |
          python3 tools/package_ipa.py \
            --app build/DerivedData/Build/Products/Release-iphoneos/Eudes.app \
            --output "build/delivery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --version "$DELIVERY_VERSION" \
            --build "$DELIVERY_BUILD" \
            --delivery-id "$DELIVERY_ID"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: build/delivery-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
