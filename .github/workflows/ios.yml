name: iOS tests

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-review-${{ github.event.pull_request.number }}-${{ ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'review-validée') && 'validated' || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'review-validée' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: XCTest · iPhone simulator
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out current sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check review label and commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/check-review-label.sh

      - name: Test delivery versioning and project automation
        run: python3 -m unittest discover -s tests -v

      - name: Read toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # La tranche simulateur d'EudesLlama est compilée depuis une révision figée de
      # llama.cpp : les octets produits ne dépendent pas de notre code. On réutilise ce
      # build d'un run à l'autre, jamais le code de l'app. La clé porte la version de
      # Xcode et l'empreinte du script qui fixe la révision : toute mise à jour de l'un
      # ou de l'autre vide le cache au lieu de réutiliser un binaire périmé.
      - name: Restore the llama.cpp simulator build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ios/Packages/EudesLlama/Artifacts
          key: llama-sim-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('tools/prepare-llama-simulator.sh') }}

      - name: Run the complete XCTest suite
        run: bash tools/test-ios.sh

      - name: Recheck review after tests
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/check-review-label.sh

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14
