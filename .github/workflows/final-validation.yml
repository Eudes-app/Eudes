name: Validation finale — compiler et fusionner
run-name: 'Validation finale PR #${{ inputs.pr_number }} · ${{ inputs.commit_sha }}'
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de la PR'
        required: true
        type: string
      commit_sha:
        description: 'Commit validé (SHA complet de 40 caractères)'
        required: true
        type: string
      iphone_decision:
        description: 'Tests effectués sur un iPhone réel, ou tests non nécessaires'
        required: true
        type: choice
        options: ['Tests iPhone validés', 'Non nécessaire']
      confirm_final:
        description: 'Je valide ce commit et autorise sa compilation puis sa fusion dans main'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  PR_NUMBER: ${{ inputs.pr_number }}
  REVIEWED_SHA: ${{ inputs.commit_sha }}

concurrency:
  group: eudes-final-validation
  cancel-in-progress: false

jobs:
  compile:
    if: github.ref == 'refs/heads/main' && inputs.confirm_final
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      base: ${{ steps.guard.outputs.base }}
    env:
      CONFIRM_FINAL: ${{ inputs.confirm_final }}
      IPHONE_DECISION: ${{ inputs.iphone_decision }}
    steps:
      - name: Select Xcode
        run: |
          selected="$(xcode-select -p)"
          if [[ "$selected" == */CommandLineTools ]]; then
            selected=/Applications/Xcode.app/Contents/Developer
          fi
          test -d "$selected"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Verify manual approval, exact commit, CI and iPhone evidence
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/tools/delivery_control.py final
      - name: Record manual validation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: |
          python3 control/tools/update-project-workflow.py 'Validation manuelle' --field 'Livraison finale'
          if [[ "$IPHONE_DECISION" == 'Tests iPhone validés' ]]; then
            python3 control/tools/update-project-workflow.py 'Validé manuellement' --field 'Validation iPhone'
          elif [[ "$IPHONE_DECISION" == 'Non nécessaire' ]]; then
            python3 control/tools/update-project-workflow.py 'Non nécessaire' --field 'Validation iPhone'
          fi
      - name: Check out the validated PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
          path: source
          persist-credentials: false
      - name: Mark final compilation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: python3 control/tools/update-project-workflow.py Compilation --field 'Livraison finale'
      - name: Compile Release for iPhone
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          SIGNED_BUILD: "false"
        run: bash control/tools/build-device.sh
      - name: Recheck approval after compilation
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_BASE: ${{ steps.guard.outputs.base }}
        run: python3 control/tools/delivery_control.py final

  merge:
    needs: compile
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      CONFIRM_FINAL: ${{ inputs.confirm_final }}
      IPHONE_DECISION: ${{ inputs.iphone_decision }}
      APPROVED_BASE: ${{ needs.compile.outputs.base }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Recheck prerequisites and merge the exact approved SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/tools/delivery_control.py merge
      # GITHUB_TOKEN merges do not trigger the project event workflow. Update explicitly.
      - name: Record verified merge
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: python3 control/tools/update-project-workflow.py Fusionné --field 'Livraison finale'
